[build]
  command = "npm ci --prefix frontend --no-audit --no-fund && npm run build --prefix frontend"
  publish = "frontend/build"

[build.environment]
  CI                    = "false"
  NODE_VERSION          = "20"
  GENERATE_SOURCEMAP    = "false"
  DISABLE_ESLINT_PLUGIN = "true"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
